<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市公园3D模型效果图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #87CEEB;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 100;
            min-width: 280px;
        }
        #ui-panel h1 {
            font-size: 18px;
            color: #2c5530;
            margin-bottom: 15px;
            border-bottom: 2px solid #4a7c59;
            padding-bottom: 8px;
        }
        .view-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .view-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4a7c59, #2c5530);
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .view-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 124, 89, 0.4);
        }
        .view-btn.active {
            background: linear-gradient(135deg, #6b9b7a, #4a7c59);
            box-shadow: 0 2px 8px rgba(74, 124, 89, 0.5);
        }
        .export-section {
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }
        .export-section h3 {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
        .export-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.4);
        }
        .time-control {
            margin-bottom: 15px;
        }
        .time-control label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
        }
        .time-slider {
            width: 100%;
            cursor: pointer;
        }
        #info-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 50px;
            border-radius: 12px;
            font-size: 16px;
            color: #333;
            z-index: 200;
            text-align: center;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4a7c59;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="loading">
            <div class="loading-spinner"></div>
            <div>正在加载3D公园场景...</div>
        </div>
        
        <div id="ui-panel">
            <h1>🌳 城市公园3D模型</h1>
            
            <div class="time-control">
                <label>时间控制 (日光): <span id="time-value">12:00</span></label>
                <input type="range" class="time-slider" id="time-slider" min="6" max="18" value="12" step="0.5">
            </div>
            
            <div class="view-buttons">
                <button class="view-btn active" data-view="aerial">🏙️ 整体鸟瞰图</button>
                <button class="view-btn" data-view="landscape">🌿 主要景观特写</button>
                <button class="view-btn" data-view="facility">🪑 设施细节图</button>
                <button class="view-btn" data-view="playground">🎠 游乐区视角</button>
                <button class="view-btn" data-view="free">🎮 自由漫游模式</button>
            </div>
            
            <div class="export-section">
                <h3>📷 导出效果图</h3>
                <button class="export-btn" id="export-btn">导出高清图片 (3000×2000)</button>
            </div>
        </div>
        
        <div id="info-display">
            <strong>操作提示:</strong> 鼠标左键旋转 | 滚轮缩放 | 右键平移
        </div>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        window.addEventListener('error', function(e) {
            console.error('页面错误:', e.error || e.message);
            var loading = document.getElementById('loading');
            if (loading && loading.style.display !== 'none') {
                loading.innerHTML = '<div style="color: #e74c3c; font-weight: bold;">加载出错</div><div style="font-size: 12px; margin-top: 10px;">' + (e.message || '请刷新页面重试') + '</div>';
            }
        });
        
        function checkScriptLoaded() {
            if (typeof THREE !== 'undefined') {
                console.log('✅ Three.js 加载成功, 版本:', THREE.REVISION);
                if (typeof THREE.OrbitControls !== 'undefined') {
                    console.log('✅ OrbitControls 加载成功');
                } else {
                    console.warn('⚠️ OrbitControls 未加载，将使用基础浏览模式');
                }
            } else {
                console.error('❌ Three.js 加载失败');
            }
        }
        
        if (document.readyState === 'complete') {
            checkScriptLoaded();
        } else {
            window.addEventListener('load', checkScriptLoaded);
        }
    </script>
    <script src="park-scene.js?v=4"></script>
</body>
</html>
